simulation:
  connect_mode: "gui"    # "gui" ou "direct"
  dt: 0.01
  max_steps: 20000
  max_sim_time: 200.0

physics:
  gravity: [0.0, 0.0, -9.81]

#===============================================================
# DÉFINITIONS DU MONDE
#===============================================================
world:
  obstacles:
    - type: "cube"
      center: [2.0, 0.0, 0.5]
      length: 1.0
      width: 1.0
      height: 1.0

    - type: "sphere"
      center: [-2.0, 1.0, 1.0]
      radius: 0.5

    - type: "cylinder"
      center: [0.0, 3.0, 1.5]
      radius: 0.25
      height: 3.0

agents:
  # ===================== DRONE 0 =====================
  - type: "uav"
    name: "drone_0"
    urdf_path: "assets/quadrotor.urdf"

    start_pos: [1.0, 0.0, 0.2]
    start_orn_euler: [0.0, 0.0, 0.0]

    waypoints:
      - [3.0, 0.0, 1.0]
      - [3.0, 3.0, 1.0]
      - [0.0, 3.0, 1.0]
      - [0.0, 0.0, 1.0]

    logging:
      enabled: true
      dir: "logs"
      file: "drone_0_log.csv"

    acc_limit_xy: 5.0
    acc_limit_z: 5.0
    F_max_factor: 2.5

    pos_tolerance: 0.05
    vel_tolerance: 0.05

    yaw_align_gain: 4.0
    yaw_rate_max_deg: 120.0
    yaw_align_threshold_deg: 10.0

    tilt_gain: 0.4
    pitch_max_deg: 35.0
    roll_max_deg: 35.0
    tilt_smoothing: 0.5

    components:
      controller_x:
        gains: {Kp: 1.0, Ki: 0.0, Kd: 0.1}
        windup: 0.0
      controller_y:
        gains: {Kp: 1.0, Ki: 0.0, Kd: 0.1}
        windup: 0.0
      controller_z:
        gains: {Kp: 2.0, Ki: 0.0, Kd: 0.2}
        windup: 0.0

    sensors:
      gps:
        enabled: true
        position_noise_std: 0.2
        velocity_noise_std: 0.1

      imu:
        enabled: true
        accel_noise_std: 0.3
        gyro_noise_std: 0.03
        gravity: 9.81

      ekf:
        enabled: false   # EKF désactivé

      lidar:
        enabled: true   # Lidar désactivé
        max_distance: 10.0
        angle_resolution: 1.0

    RRT3DPlanner:
      enabled: false
      world_bounds:
        x: [-5.0, 5.0]
        y: [-5.0, 5.0]
        z: [0.0, 3.0]
      max_iterations: 1000
      step_size: 0.5
      goal_tolerance: 0.2

