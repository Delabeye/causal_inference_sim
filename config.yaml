#===============================================================
# CONFIGURATION PRINCIPALE DU SIMULATEUR
#===============================================================
simulation:
  # "gui" pour voir la simulation, "direct" pour tourner en arrière-plan
  connect_mode: "gui"

  # Pas de temps de la simulation (1/240. = 240 Hz)
  dt: 0.00416

  # Durée maximale de la simulation en secondes
  max_sim_time: 30.0

# Gravité
physics:
  gravity: [0.0, 0.0, -9.81]

#===============================================================
# DÉFINITIONS DU MONDE
#===============================================================
world:
  # Liste de tous les obstacles statiques
  obstacles:
    - type: "cube"
      center: [2.0, 0.0, 0.5]
      length: 1.0
      width: 1.0
      height: 1.0

    - type: "sphere"
      center: [-2.0, 1.0, 1.0]
      radius: 0.5

    - type: "cylinder"
      center: [0.0, 3.0, 1.5]
      radius: 0.25
      height: 3.0

#===============================================================
# DÉFINITIONS DES AGENTS (DRONES)
#===============================================================
agents:
  # --- Premier drone : suit une liste de waypoints ---
  - type: "uav"
    name: "drone_0"
    urdf_path: "assets/quadrotor.urdf"
    start_pos: [0.0, 0.0, 0.2]
    start_orn_euler: [0.0, 0.0, 0.0]

    physics:
      thrust_coeff: 2.2e-8
      max_rpm: 25000.0
      motor_link_indices: [0, 1, 2, 3]

    # Waypoints dans le repère monde (x, y, z)
    # Le drone s'y rendra dans l'ordre.
    waypoints:
      - [2.0, 1.0, 1.0]
      - [0.0, 2.0, 1.0]
      - [-1.0, 1.0, 1.0]

    # Paramètres supplémentaires (optionnels)
    acc_limit_xy: 5.0
    acc_limit_z: 5.0
    F_max_factor: 2.5
    pos_tolerance: 0.05
    vel_tolerance: 0.05

    # Orientation "réaliste"
    yaw_align_gain: 4.0
    yaw_rate_max_deg: 120.0
    yaw_align_threshold_deg: 10.0

    tilt_gain: 0.4
    pitch_max_deg: 35.0
    roll_max_deg: 35.0
    tilt_smoothing: 0.5

    components:
      controller_x:
        type: "pid"
        gains:
          Kp: 1.0
          Ki: 0.0
          Kd: 2.0
        windup: 1.0

      controller_y:
        type: "pid"
        gains:
          Kp: 1.0
          Ki: 0.0
          Kd: 2.0
        windup: 1.0

      controller_z:
        type: "pid"
        gains:
          Kp: 3.0
          Ki: 0.0
          Kd: 4.0
        windup: 1.0

  # --- Deuxième drone : par exemple il reste à une position fixe ---
  - type: "uav"
    name: "drone_1"
    urdf_path: "assets/quadrotor.urdf"
    start_pos: [-1.0, 0.0, 0.2]
    start_orn_euler: [0.0, 0.0, 0.0]

    physics:
      thrust_coeff: 2.2e-8
      max_rpm: 25000.0
      motor_link_indices: [0, 1, 2, 3]

    # Ici un seul setpoint, le drone fera juste du vol stationnaire
    setpoint: [-1.0, 0.0, 1.0]

    acc_limit_xy: 5.0
    acc_limit_z: 5.0
    F_max_factor: 2.5
    pos_tolerance: 0.05
    vel_tolerance: 0.05

    yaw_align_gain: 4.0
    yaw_rate_max_deg: 120.0
    yaw_align_threshold_deg: 10.0

    tilt_gain: 0.4
    pitch_max_deg: 35.0
    roll_max_deg: 35.0
    tilt_smoothing: 0.5

    components:
      controller_x:
        type: "pid"
        gains:
          Kp: 1.0
          Ki: 0.0
          Kd: 2.0
        windup: 1.0

      controller_y:
        type: "pid"
        gains:
          Kp: 1.0
          Ki: 0.0
          Kd: 2.0
        windup: 1.0

      controller_z:
        type: "pid"
        gains:
          Kp: 3.0
          Ki: 0.0
          Kd: 4.0
        windup: 1.0

#===============================================================
# OBJECTIFS (on les laisse vides, on utilise les waypoints)
#===============================================================
objectives: []
