#==================================================================
# CONFIGURATION PRINCIPALE DU SIMULATEUR
#==================================================================

simulation:
  # 'gui' pour voir la simulation, 'direct' pour tourner en arrière-plan
  connect_mode: "gui"
  # Pas de temps de la simulation (1/240. = 240 Hz)
  dt: 0.00416
  # Durée maximale de la simulation en secondes
  max_sim_time: 30.0

physics:
  gravity: [0.0, 0.0, -9.81]

#==================================================================
# DÉFINITIONS DU MONDE
#==================================================================

world:
  # Liste de tous les obstacles statiques
  obstacles:
    - type: "cube"
      center: [2.0, 0.0, 0.5]
      length: 1.0
      width: 1.0
      height: 1.0

    - type: "sphere"
      center: [-2.0, 1.0, 1.0]
      radius: 0.5

    - type: "cylinder"
      center: [0.0, 3.0, 1.5]
      radius: 0.25
      height: 3.0

#==================================================================
# DÉFINITIONS DES AGENTS
#==================================================================

agents:

  - type: "uav"
    name: "drone_0"
    urdf_path: "assets/quadrotor.urdf"

    # Position et orientation initiales
    start_pos: [0.0, 0.0, 0.2]        # un peu au-dessus du sol
    start_orn_euler: [1.0, 0.0, 0.0]  # pas de rotation

    # Paramètres physiques spécifiques
    physics:
      thrust_coeff: 2.2e-8          # N / (RPM^2)
      max_rpm: 25000.0
      # Indices des liens moteurs dans l'URDF
      # (adapter si besoin à ton quadrotor.urdf)
      motor_link_indices: [0, 1, 2, 3]

    # Définition des composants
    components:

      gps:
        position_noise_std: 0.05
        velocity_noise_std: 0.02

      estimator:
        type: "kalman"
        process_noise: 0.01

      controller_z:
        type: "pid"
        gains:
          Kp: 0.5
          Ki: 0.0
          Kd: 0.1
        windup: 1.0

objectives:
  - type: "reach_setpoint"
    agent: "drone_0"
    final_position: [0.0, 0.0, 1.5]