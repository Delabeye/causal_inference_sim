#===============================================================
# CONFIGURATION PRINCIPALE DU SIMULATEUR
#===============================================================
simulation:
  # "gui" pour voir la simulation, "direct" pour tourner en arrière-plan
  connect_mode: "gui"


  # Pas de temps de la simulation (1/240. = 240 Hz)
  dt: 0.00416


  # Durée maximale de la simulation en secondes
  max_sim_time: 60.0


# Gravité
physics:
  gravity: [0.0, 0.0, -9.81]


#===============================================================
# CONFIGURATION DU PATH PLANNING (RRT*)
#===============================================================



#===============================================================
# DÉFINITIONS DU MONDE
#===============================================================
world:
  obstacles:
    - type: "cube"
      center: [2.0, 0.0, 1.0]
      length: 1.0
      width: 1.0
      height: 2.0
      knowledge: True
      id : 1


    - type: "sphere"
      center: [-2.0, 1.0, 1.0]
      radius: 0.5
      knowledge: True
      id : 2


    - type: "cylinder"
      center: [0.0, 3.0, 1.5]
      radius: 0.25
      height: 3.0
      knowledge: True
      id : 3


#===============================================================
# DÉFINITIONS DES AGENTS (10 DRONES)
#===============================================================
swarm:
  enabled: false       # <- Reste à false pour tester le RRT* seul
  leader: "drone_0"   
  min_sep: 0.6        
  avoid_gain: 0.5     


agents:
  #------------------- DRONE 0 : LEADER ------------------------
  - type: "uav"
    name: "drone_0"
    urdf_path: "assets/quadrotor.urdf"
    start_pos: [0.0, 0.0, 0.0]
    start_orn_euler: [0.0, 0.0, 0.0]


    physics:
      thrust_coeff: 3.16e-10  # Au lieu de valeurs plus hautes
      torque_coeff: 7.94e-12  # Au lieu de valeurs plus hautes
      max_rpm: 22000.0        # Vitesse max standard
      motor_link_indices: [0, 1, 2, 3]


    waypoints:
      - [5.0, 0.0, 1.0]
      - [2.0, 1.0, 1.0]
      - [2.0, -1.0, 1.2]
      - [0.0, -2.0, 1.0]
      - [-2.0, -1.0, 1.0]
      - [-2.0, 1.0, 1.2]
      - [0.0, 0.0, 1.0]


    # Paramètres de dynamique "simple"
    acc_limit_xy: 5.0
    acc_limit_z: 5.0
    F_max_factor: 2.5
    pos_tolerance: 0.05
    vel_tolerance: 0.05


    # Orientation réaliste
    yaw_align_gain: 4.0
    yaw_rate_max_deg: 120.0
    yaw_align_threshold_deg: 10.0


    tilt_gain: 0.4
    pitch_max_deg: 35.0
    roll_max_deg: 35.0
    tilt_smoothing: 0.5
  
    sensors:
      gps:
        enabled: true
        position_noise_std: 0.1
        velocity_noise_std: 0.05


      imu:
        enabled: true
        accel_noise_std: 0.3
        gyro_noise_std: 0.03
        gravity: 9.81

      lidar:
        enabled: true
        max_distance: 20.0
        angle_resolution: 4.0   # Degrés entre chaque rayon (plus c'est petit, plus c'est précis mais lent)
        fov_horizontal: 90.0    # Cone de 90 degrés devant (de -45 à +45)
        fov_vertical: 30.0      # Cone de 30 degrés vertical (de -15 à +15)
        frequency: 10.0          # Scans par seconde
      
    astar:
      world_bounds:
        x: [-10, 10]
        y: [-10, 10]
        z: [0.1, 5.0]
      

    components:
      controller_x:
        type: "pid"
        gains:
          Kp: 1.0
          Ki: 0.0
          Kd: 2.0
        windup: 1.0


      controller_y:
        type: "pid"
        gains:
          Kp: 1.0
          Ki: 0.0
          Kd: 2.0
        windup: 1.0


      controller_z:
        type: "pid"
        gains:
          Kp: 3.0
          Ki: 4.0
          Kd: 4.0
        windup: 1.0

  - name: "Radar_Alpha"
    type: "radar"
    pos: [3, 3, 0]      # Position précise (x, y, z)
    range: 4.0          # Portée de détection en mètres
    urdf_path: "assets/cube.urdf"
  # Radar 2 : Courte portée près de l'objectif
  - name: "Radar_Beta"
    type: "radar"
    pos: [5, 5, 0]
    range: 1.5
    urdf_path: "assets/cube.urdf"