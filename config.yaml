#==================================================================
# CONFIGURATION PRINCIPALE DU SIMULATEUR
#==================================================================

simulation:
  # 'gui' pour voir la simulation, 'direct' pour tourner en arrière-plan
  connect_mode: "gui"
  # Pas de temps de la simulation (1/240. = 240 Hz)
  dt: 0.00416
  # Durée maximale de la simulation en secondes
  max_sim_time: 30.0

# Gravité
physics:
  gravity: [0.0, 0.0, -9.81]

#==================================================================
# DÉFINITIONS DU MONDE
#==================================================================

world:
  # Liste de tous les obstacles statiques
  obstacles:
    - type: "cube"
      center: [2.0, 0.0, 0.5]
      length: 1.0
      width: 1.0
      height: 1.0

    - type: "sphere"
      center: [-2.0, 1.0, 1.0]
      radius: 0.5

    - type: "cylinder"
      center: [0.0, 3.0, 1.5]
      radius: 0.25
      height: 3.0

#==================================================================
# DÉFINITIONS DES AGENTS (DRONES)
#==================================================================

agents:

  # --- Premier drone ---
  - type: "uav"
    name: "drone_0"
    urdf_path: "assets/quadrotor.urdf"

    start_pos: [0.0, 0.0, 0.2]
    start_orn_euler: [0.0, 0.0, 0.0]

    setpoint: [2.0, 1.0, 1.0]

    physics:
      thrust_coeff: 2.2e-8   # plus utilisé ici
      max_rpm: 25000.0
      motor_link_indices: [0, 1, 2, 3]


  
