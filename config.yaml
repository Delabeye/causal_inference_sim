#==================================================================
# CONFIGURATION PRINCIPALE DU SIMULATEUR
# C'est le seul fichier à modifier pour changer la simulation.
#==================================================================

simulation:
  # 'gui' pour voir la simulation, 'direct' pour tourner en arrière-plan
  connect_mode: 'gui'
  # Pas de temps de la simulation (1/240. = 240 Hz)
  dt: 0.00416
  # Durée maximale de la simulation en secondes
  max_sim_time: 30.0

physics:
  gravity: [0, 0, -9.81]

#==================================================================
# DÉFINITIONS DU MONDE
#==================================================================
world:
  # Liste de tous les obstacles statiques
  obstacles:
    - type: 'cube'
      center: [2, 0, 0.5]
      length: 1
      width: 1
      height: 1
      
    - type: 'sphere'
      center: [-2, 1, 1]
      radius: 0.5
      
    - type: 'cylinder'
      center: [0, 3, 1.5]
      radius: 0.25
      height: 3

#==================================================================
# DÉFINITIONS DES AGENTS
# C'est une liste. Vous pouvez ajouter autant d'agents que vous le
# souhaitez (drone_1, drone_2, ugv_1, etc.)
#==================================================================
agents:
  
  # --- Définition du premier agent ---
  - type: 'uav'
    name: 'drone_0'
    urdf_path: "assets/quadrotor.urdf" # Doit correspondre à votre fichier
    start_pos: 
    start_orn_euler: 
    
    # Objectif (consigne) pour cet agent
    setpoint: [0, 0, 1.5]

    # Paramètres physiques spécifiques (globaux pour tous les UAVs)
    physics:
      thrust_coeff: 2.2e-8     # N / (RPM^2) [3, 4, 5, 6, 7]
      max_rpm: 25000
      # Indices des liens moteurs dans l'URDF [8, 9]
      motor_link_indices:  

    # Définition des composants (selon votre schéma [Image 1])
    components:
      
      # Paramètres pour 'sensor camera' [Image 1]
      gps:
        position_noise_std: 0.05
        velocity_noise_std: 0.02
        
      # Paramètres pour 'sensor filter' [Image 1]
      estimator:
        type: 'kalman' # (Pour l'instant, nous utilisons un stub)
        process_noise: 0.01

      # Paramètres pour 'controller' [Image 1]
      controller_z:
        type: 'pid'
        gains: {Kp: 0.5, Ki: 0.0, Kd: 0.1, }
        windup: 1

