    wind: {wind_mean: [0,0,0], turbulence: 10}

  - type: "uav"
    name: "drone_3"
    urdf_path: "assets/quadrotor.urdf"
    body_id: 0003
    mass: 0.027
    start_pos: [-1.0, 0.0, 0.0]
    start_orn_euler: [0.0, 0.0, 0.0]
