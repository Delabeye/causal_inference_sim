  - name: "Radar_Alpha"
    type: "radar"
    pos: [3, 3, 0]      
    range: 4.0          
    urdf_path: "assets/radar.urdf"

  - name: "Radar_Beta"
    type: "radar"
    pos: [5, 5, 0]
    range: 1.5
    urdf_path: "assets/radar.urdf"
    position_noise_std: 0.2
    velocity_noise_std: 0.1
    body_id: 1001